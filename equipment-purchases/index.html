<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipment Purchases | MedPro Respiratory</title>
<style>
  :root{
    /* MedPro brand colours - change here (and BRAND in the script below for the PDF) */
    --brand:#0a5da8; --brand-dark:#073e73; --accent:#3a9d3f; --bg:#f2f6f8; --card:#fff;
    --text:#1c2b33; --muted:#5d6f78; --line:#d6e0e5; --danger:#b3261e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
  header{background:#fff;color:var(--brand-dark);padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--accent)}
  header img{height:48px;display:none}
  header h1{font-size:1.25rem;margin:0}
  header small{display:block;opacity:.85}
  main{max-width:900px;margin:0 auto;padding:12px 12px 90px}
  section.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  h2{font-size:1.05rem;margin:0 0 10px;color:var(--brand-dark)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:3px}
  input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid #b9c8cf;border-radius:8px;background:#fff;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
  .full{grid-column:1/-1}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:#e8f0f3;color:var(--brand-dark);padding:10px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .badge{display:inline-block;min-width:20px;background:var(--accent);color:#fff;border-radius:10px;font-size:.75rem;padding:1px 6px;margin-left:5px}
  .item{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item .info{flex:1;min-width:0}
  .item .nm{font-weight:600}
  .item .pn{font-size:.85rem;color:var(--brand)}
  .item .ds{font-size:.85rem;color:var(--muted)}
  .item .pr{font-size:.9rem;font-weight:600;color:var(--accent)}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:36px;height:36px;border-radius:8px;border:1px solid #b9c8cf;background:#fff;font-size:1.2rem;cursor:pointer}
  .qty input{width:54px;text-align:center;padding:8px 2px}
  .btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
  .btn.alt{background:#e8f0f3;color:var(--brand-dark);border:1px solid var(--line)}
  .btn:disabled{opacity:.5;cursor:default}
  .rm{background:none;border:0;color:var(--danger);font-size:1.3rem;cursor:pointer}
  .empty,.msg{color:var(--muted);padding:8px 0}
  .err{color:var(--danger)}
  .custom{border-top:2px dashed var(--line);margin-top:12px;padding-top:12px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px;display:flex;justify-content:center;gap:10px;align-items:center}
  .bar .btn{flex:1;max-width:420px;font-size:1.05rem}
  .bar span{color:var(--muted)}
</style>
</head>
<body>
<header>
  <img id="logo" src="MedPro-logo.png" alt="MedPro Respiratory" onload="this.style.display='block'" onerror="this.remove()">
  <div><h1>Equipment Purchases</h1><small>MedPro Respiratory</small></div>
</header>

<main>
  <section class="card">
    <h2>Client &amp; Request</h2>
    <div class="grid">
      <div><label for="client">Client name *</label><input id="client" autocomplete="off"></div>
      <div><label for="phn">PHN *</label><input id="phn" inputmode="numeric" autocomplete="off" maxlength="14" placeholder="9876 543 210"></div>
      <div><label for="staff">Staff name *</label><input id="staff" autocomplete="name"></div>
      <div><label for="date">Date</label><input id="date" type="date"></div>
      <div class="full"><label for="office">Office location to send equipment to *</label><select id="office"></select></div>
      <div class="full"><label for="notes">Notes</label><textarea id="notes" rows="3"></textarea></div>
    </div>
  </section>

  <section class="card">
    <h2>Select Equipment</h2>
    <div class="tabs" id="tabs"></div>
    <input id="search" type="search" placeholder="Search this list..." style="margin-bottom:6px">
    <div id="list"><div class="msg">Loading equipment list...</div></div>

    <div class="custom">
      <h2>Add equipment not listed (<span id="customType"></span>)</h2>
      <div class="grid">
        <div><label for="cName">Name *</label><input id="cName"></div>
        <div><label for="cPart">Part number</label><input id="cPart"></div>
        <div class="full"><label for="cDesc">Description</label><input id="cDesc"></div>
        <div><label for="cQty">Quantity</label><input id="cQty" type="number" min="1" value="1" inputmode="numeric"></div>
        <div style="align-self:end"><button class="btn alt" id="cAdd" style="width:100%">+ Add to request</button></div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Selected Equipment (<span id="count">0</span>)</h2>
    <div id="selected"><div class="empty">Nothing selected yet.</div></div>
  </section>
</main>

<div class="bar">
  <span id="barMsg"></span>
  <button class="btn" id="make">Create PDF</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
// ---- Settings -------------------------------------------------------------
const TYPES = ["Concentrator","Fill Station","Cylinders","POC","Regulator","OCD"]; // must match sheet names in equipment.xlsx
const OFFICES = ["Fort St John","Prince George","Kamloops","Kelowna","Castlegar","Cranbrook"].sort(); // dropdown choices (alphabetical)
const BRAND = { dark:[7,62,115], main:[10,93,168], accent:[58,157,63], light:[232,240,248] }; // PDF colours (RGB)
const COMPANY = "MedPro Respiratory";

// ---- State ----------------------------------------------------------------
const catalog = {};            // type -> [{name, part, desc}]
const selected = [];           // [{type, name, part, desc, qty, custom}]
let current = TYPES[0];
const $ = id => document.getElementById(id);

function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtPrice(v){ if(v==="") return ""; const n = Number(String(v).replace(/[$,\s]/g,"")); return isNaN(n) ? v : "$" + n.toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2}); }
const keyOf = (t,n,p) => [t,n,p].join("\u0001");
const findSel = (t,n,p) => selected.find(s => keyOf(s.type,s.name,s.part) === keyOf(t,n,p));

// ---- Load spreadsheet -----------------------------------------------------
async function loadCatalog(){
  TYPES.forEach(t => catalog[t] = []);
  try{
    const res = await fetch("equipment.xlsx?v=" + Date.now());
    if(!res.ok) throw new Error("HTTP " + res.status);
    const wb = XLSX.read(await res.arrayBuffer(), {type:"array"});
    TYPES.forEach(t => {
      const sheetName = wb.SheetNames.find(n => n.trim().toLowerCase() === t.toLowerCase());
      if(!sheetName) return;
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {defval:""});
      rows.forEach(r => {
        const get = k => { const f = Object.keys(r).find(x => x.trim().toLowerCase() === k); return f ? String(r[f]).trim() : ""; };
        const name = get("name");
        if(!name || /^example\b/i.test(name)) return;
        catalog[t].push({name, part:get("part number"), desc:get("description"), price:fmtPrice(get("medpro price"))});
      });
    });
  }catch(e){
    $("list").innerHTML = '<div class="msg err">Could not load the equipment list (' + esc(e.message) + '). You can still add equipment manually below.</div>';
    return false;
  }
  return true;
}

// ---- Render ---------------------------------------------------------------
function renderTabs(){
  $("tabs").innerHTML = TYPES.map(t => {
    const n = selected.filter(s => s.type === t).length;
    return `<button class="tab ${t===current?"active":""}" data-t="${esc(t)}">${esc(t)}${n?`<span class="badge">${n}</span>`:""}</button>`;
  }).join("");
  $("customType").textContent = current;
}

function renderList(){
  const q = $("search").value.trim().toLowerCase();
  const items = catalog[current].filter(i => !q || (i.name+" "+i.part+" "+i.desc).toLowerCase().includes(q));
  if(!items.length){
    $("list").innerHTML = `<div class="empty">${catalog[current].length ? "No matches." : "No equipment listed for this type yet - add it manually below."}</div>`;
    return;
  }
  $("list").innerHTML = items.map(i => {
    const s = findSel(current,i.name,i.part);
    return `<div class="item">
      <div class="info"><div class="nm">${esc(i.name)}</div>
        ${i.part?`<div class="pn">Part # ${esc(i.part)}</div>`:""}${i.price?`<div class="pr">MedPro Price: ${esc(i.price)}</div>`:""}
        ${i.desc?`<div class="ds">${esc(i.desc)}</div>`:""}</div>
      ${s ? `<div class="qty"><button data-a="dec" data-n="${esc(i.name)}" data-p="${esc(i.part)}">&minus;</button>
              <input type="number" min="1" value="${s.qty}" data-a="set" data-n="${esc(i.name)}" data-p="${esc(i.part)}" inputmode="numeric">
              <button data-a="inc" data-n="${esc(i.name)}" data-p="${esc(i.part)}">+</button></div>`
          : `<button class="btn alt" data-a="add" data-n="${esc(i.name)}" data-p="${esc(i.part)}">Add</button>`}
    </div>`;
  }).join("");
}

function renderSelected(){
  $("count").textContent = selected.length;
  $("barMsg").textContent = selected.length ? selected.reduce((a,s)=>a+s.qty,0) + " item(s)" : "";
  if(!selected.length){ $("selected").innerHTML = '<div class="empty">Nothing selected yet.</div>'; return; }
  $("selected").innerHTML = selected.map((s,idx) => `<div class="item">
      <div class="info"><div class="nm">${esc(s.name)} <small style="color:var(--muted);font-weight:400">(${esc(s.type)}${s.custom?", manual entry":""})</small></div>
        ${s.part?`<div class="pn">Part # ${esc(s.part)}</div>`:""}${s.price?`<div class="pr">MedPro Price: ${esc(s.price)}</div>`:""}${s.desc?`<div class="ds">${esc(s.desc)}</div>`:""}</div>
      <div class="qty"><button data-r="dec" data-i="${idx}">&minus;</button>
        <input type="number" min="1" value="${s.qty}" data-r="set" data-i="${idx}" inputmode="numeric">
        <button data-r="inc" data-i="${idx}">+</button></div>
      <button class="rm" title="Remove" data-r="del" data-i="${idx}">&times;</button></div>`).join("");
}

function refresh(keepFocus){ renderTabs(); if(!keepFocus) renderList(); renderSelected(); }

// ---- Events ---------------------------------------------------------------
$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if(!b) return;
  current = b.dataset.t; $("search").value = ""; refresh();
});
$("search").addEventListener("input", renderList);

function setQty(s, v){ s.qty = Math.max(1, parseInt(v,10) || 1); }

$("list").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const {a,n,p} = b.dataset, item = catalog[current].find(i => i.name===n && i.part===p);
  let s = findSel(current,n,p);
  if(a==="add" && item) selected.push({type:current, name:n, part:p, desc:item.desc, price:item.price, qty:1});
  else if(s && a==="inc") s.qty++;
  else if(s && a==="dec"){ s.qty--; if(s.qty<1) selected.splice(selected.indexOf(s),1); }
  refresh();
});
$("list").addEventListener("change", e => {
  const el = e.target; if(el.dataset.a !== "set") return;
  const s = findSel(current, el.dataset.n, el.dataset.p); if(s) setQty(s, el.value);
  refresh();
});

$("selected").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const i = +b.dataset.i, s = selected[i]; if(!s) return;
  if(b.dataset.r==="inc") s.qty++;
  else if(b.dataset.r==="dec") s.qty = Math.max(1, s.qty-1);
  else if(b.dataset.r==="del") selected.splice(i,1);
  refresh();
});
$("selected").addEventListener("change", e => {
  const el = e.target; if(el.dataset.r !== "set") return;
  const s = selected[+el.dataset.i]; if(s) setQty(s, el.value);
  refresh();
});

$("cAdd").addEventListener("click", () => {
  const name = $("cName").value.trim();
  if(!name){ $("cName").focus(); return; }
  const part = $("cPart").value.trim(), desc = $("cDesc").value.trim();
  const qty = Math.max(1, parseInt($("cQty").value,10) || 1);
  const ex = findSel(current,name,part);
  if(ex) ex.qty += qty; else selected.push({type:current, name, part, desc, qty, custom:true});
  ["cName","cPart","cDesc"].forEach(id => $(id).value = ""); $("cQty").value = 1;
  refresh();
});

// PHN: digits only, grouped 4-3-3 for readability
$("phn").addEventListener("input", e => {
  const d = e.target.value.replace(/\D/g,"").slice(0,10);
  e.target.value = [d.slice(0,4), d.slice(4,7), d.slice(7)].filter(Boolean).join(" ");
});
// remember staff name & office on this device only (no client data is ever stored)
$("office").innerHTML = '<option value="">Select office...</option>' + OFFICES.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
["staff","office"].forEach(id => {
  try{ $(id).value = localStorage.getItem("ep_"+id) || ""; }catch(e){}
  $(id).addEventListener("change", () => { try{ localStorage.setItem("ep_"+id, $(id).value.trim()); }catch(e){} });
});

// ---- PDF ------------------------------------------------------------------
async function logoData(){
  try{
    const img = $("logo"); if(!img || !img.complete || !img.naturalWidth) return null;
    const c = document.createElement("canvas"); c.width = img.naturalWidth; c.height = img.naturalHeight;
    c.getContext("2d").drawImage(img,0,0);
    return {data:c.toDataURL("image/png"), w:img.naturalWidth, h:img.naturalHeight};
  }catch(e){ return null; }
}

async function makePdf(){
  const client = $("client").value.trim(), phn = $("phn").value.trim(), staff = $("staff").value.trim(), office = $("office").value.trim();
  const missing = [];
  if(!client) missing.push("client name"); if(!phn) missing.push("PHN"); if(!staff) missing.push("staff name");
  if(!office) missing.push("office location"); if(!selected.length) missing.push("at least one piece of equipment");
  if(missing.length){ alert("Please add: " + missing.join(", ") + "."); return; }

  // open the tab right away (inside the click) so phone browsers don't block the popup
  const win = window.open("", "_blank");
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:"pt", format:"letter"});
  const W = doc.internal.pageSize.getWidth(), M = 40;

  // header band
  doc.setFillColor(...BRAND.accent); doc.rect(0,80,W,5,"F");
  doc.setFillColor(...BRAND.main); doc.rect(0,76,W,4,"F");
  const lg = await logoData();
  doc.setTextColor(...BRAND.dark);
  if(lg){ const h = 52, w = h * lg.w / lg.h; doc.addImage(lg.data,"PNG",M,12,w,h); }
  else { doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.text(COMPANY, M, 40); }
  doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.text("Equipment Purchase Request", W-M, 44, {align:"right"});

  // details box
  const dv = $("date").value, dateStr = dv ? new Date(dv+"T12:00:00").toLocaleDateString("en-CA",{year:"numeric",month:"long",day:"numeric"}) : "";
  const rows = [["Client name", client],["PHN", phn],["Date", dateStr],["Requested by", staff],["Send equipment to", office]];
  doc.autoTable({
    startY:105, body:rows, theme:"plain", margin:{left:M,right:M},
    styles:{fontSize:11, cellPadding:5, textColor:[28,43,51]},
    columnStyles:{0:{fontStyle:"bold", cellWidth:130, textColor:BRAND.dark}},
    didParseCell:d => { if(d.section==="body") d.cell.styles.fillColor = d.row.index%2 ? [255,255,255] : BRAND.light; }
  });

  // equipment tables, grouped by type
  let y = doc.lastAutoTable.finalY + 18;
  doc.setTextColor(...BRAND.dark); doc.setFont("helvetica","bold"); doc.setFontSize(13);
  doc.text("Equipment Requested", M, y); y += 6;
  const body = [];
  TYPES.forEach(t => selected.filter(s => s.type===t).forEach(s => body.push([t, s.name + (s.custom ? " *" : ""), s.part, s.desc, String(s.qty)])));
  doc.autoTable({
    startY:y, margin:{left:M,right:M},
    head:[["Type","Name","Part Number","Description","Qty"]], body,
    headStyles:{fillColor:BRAND.main, textColor:255},
    styles:{fontSize:10, cellPadding:5, valign:"middle"},
    alternateRowStyles:{fillColor:BRAND.light},
    columnStyles:{0:{cellWidth:68},1:{cellWidth:120},2:{cellWidth:80},4:{cellWidth:34,halign:"center"}}
  });
  y = doc.lastAutoTable.finalY + 14;
  const total = selected.reduce((a,s)=>a+s.qty,0);
  doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(...BRAND.dark);
  doc.text("Total items: " + total, W-M, y, {align:"right"});
  if(selected.some(s=>s.custom)){ doc.setFont("helvetica","italic"); doc.setFontSize(9); doc.setTextColor(93,111,120); doc.text("* Manually entered item (not in the equipment list)", M, y); }

  const notes = $("notes").value.trim();
  if(notes){
    doc.autoTable({ startY:y+14, margin:{left:M,right:M}, head:[["Notes"]], body:[[notes]],
      headStyles:{fillColor:BRAND.main, textColor:255}, styles:{fontSize:10, cellPadding:6} });
  }

  // footer on every page
  const pages = doc.getNumberOfPages(), H = doc.internal.pageSize.getHeight();
  for(let i=1;i<=pages;i++){
    doc.setPage(i); doc.setDrawColor(...BRAND.accent); doc.setLineWidth(1.5); doc.line(M,H-40,W-M,H-40);
    doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(93,111,120);
    doc.text(COMPANY + " - Confidential: contains personal health information", M, H-26);
    doc.text("Page " + i + " of " + pages, W-M, H-26, {align:"right"});
  }

  const safe = client.replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") || "Client";
  const filename = "Equipment_Purchase_" + safe + "_" + (dv || new Date().toISOString().slice(0,10)) + ".pdf";
  const blob = doc.output("blob"), url = URL.createObjectURL(new Blob([blob],{type:"application/pdf"}));
  if(win){ win.location.href = url; }
  else { const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(() => URL.revokeObjectURL(url), 5*60*1000);
}
$("make").addEventListener("click", async () => {
  const b = $("make"); b.disabled = true; b.textContent = "Creating...";
  try{ await makePdf(); }catch(e){ alert("Could not create the PDF: " + e.message); }
  b.disabled = false; b.textContent = "Create PDF";
});

// ---- Init -----------------------------------------------------------------
$("date").value = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
renderTabs();
loadCatalog().then(ok => { if(ok) renderList(); });
</script>
</body>
</html>
